    executable: "C:/Program Files/Blender Foundation/Blender/blender.exe"
    required: false
  ffmpeg:
    executable: "C:/Tools/ffmpeg/bin/ffmpeg.exe"
    required: true
  ffprobe:
    executable: "C:/Tools/ffmpeg/bin/ffprobe.exe"
    required: true
  python:
    executable: "python.exe"
    required: true
  kdenlive:
    executable: "C:/Program Files/kdenlive/bin/kdenlive.exe"
    required: false
