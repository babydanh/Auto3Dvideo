schema_version: "1.0.0"
workflow_id: "local-free-pipeline"
name: "Local Free Fixture Pipeline"
profile: "local"
inputs:
  brief: "examples/minimal-3d-video/brief.md"
  style_bible: "examples/minimal-3d-video/style-bible.yaml"
policy:
  paid_generation: "blocked"
  external_publish: "blocked"
  custom_node_install: "blocked"
  max_retries_per_job: 1
stages:
  - id: normalize
    type: brief.normalize
    executor: mock
    outputs: [normalized-brief.json]
  - id: style
    type: style.define
    depends_on: [normalize]
    executor: mock
    outputs: [style-bible.json]
  - id: shots
    type: shots.plan
    depends_on: [style]
    executor: mock
    outputs: [shot-list.json]
  - id: mock_generate
    type: ai.generate
    depends_on: [shots]
    executor: mock
    outputs: [raw-shots/]
  - id: mock_preview
    type: render.preview
    depends_on: [mock_generate]
    executor: mock
    outputs: [preview/]
  - id: compose
    type: media.compose
    depends_on: [mock_preview]
    executor: mock
    outputs: [preview.mp4]
  - id: delivery
    type: delivery.package
    depends_on: [compose]
    executor: mock
    outputs: [delivery/manifest.json]
