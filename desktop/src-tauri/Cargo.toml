[package]
name = "auto3dvideo-desktop"
version = "0.1.0"
description = "Auto3Dvideo Windows-first automation control plane"
authors = ["Auto3Dvideo contributors"]
edition = "2021"

[lib]
name = "auto3dvideo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
http = "1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "macros", "rt"] }
